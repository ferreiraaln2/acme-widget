services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: acme_widget
      MYSQL_USER: acme
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uacme", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Acme Widget"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:mEjV39fvGN6n/ddxxYzl3XqplHsUdfg0G73KJoP+px8=
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: acme_widget
      DB_USERNAME: acme
      DB_PASSWORD: secret
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - nginx

volumes:
  mysql_data:
